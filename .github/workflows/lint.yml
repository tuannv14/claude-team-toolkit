name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skill-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json + marketplace.json present
        run: |
          jq empty .claude-plugin/plugin.json
          test "$(jq -r .name .claude-plugin/plugin.json)" = "claude-team-toolkit"
          test -f .claude-plugin/marketplace.json \
            || { echo "FAIL: .claude-plugin/marketplace.json is required for users to add this as a Claude Code marketplace"; exit 1; }
          jq empty .claude-plugin/marketplace.json
          test "$(jq -r '.plugins | length' .claude-plugin/marketplace.json)" -ge 1 \
            || { echo "FAIL: marketplace.json must list at least one plugin"; exit 1; }

      - name: Schema check — plugin.json author/repository shapes
        run: |
          # author must be object, repository must be string (per Claude's official schema)
          test "$(jq -r '.author | type' .claude-plugin/plugin.json)" = "object" \
            || { echo "FAIL: author must be an object {name, email, url}"; exit 1; }
          test "$(jq -r '.repository | type' .claude-plugin/plugin.json)" = "string" \
            || { echo "FAIL: repository must be a string URL, not an object"; exit 1; }
          echo "Schema OK: author is object, repository is string"

      - name: YAML frontmatter parse check (each SKILL.md)
        run: |
          # Use python yaml to actually parse — catches issues that grep misses
          # (e.g., unquoted colon-space in description field)
          python3 -c "
          import yaml, glob, sys
          fail = 0
          for f in sorted(glob.glob('skills/*/SKILL.md')):
            try:
              with open(f, 'r', encoding='utf-8') as fp:
                content = fp.read()
              parts = content.split('---', 2)
              if len(parts) < 3:
                print(f'FAIL: {f} missing --- delimiters')
                fail += 1
                continue
              try:
                data = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                print(f'FAIL: {f} YAML parse error: {e}')
                fail += 1
                continue
              if not isinstance(data, dict):
                print(f'FAIL: {f} frontmatter is not a dict (got {type(data).__name__})')
                fail += 1
                continue
              for required in ['name', 'description']:
                if required not in data or not data[required]:
                  print(f'FAIL: {f} missing or empty {required}')
                  fail += 1
            except Exception as e:
              print(f'FAIL: {f} unexpected: {e}')
              fail += 1
          if fail == 0:
            print('All SKILL.md frontmatters parse correctly as YAML')
          sys.exit(fail)
          "

      - name: Validate every SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            echo "Checking $f"
            # Must start with --- and have closing ---
            head -1 "$f" | grep -q '^---$' || { echo "FAIL: $f missing leading ---"; exit 1; }

            # Must have name + description fields in frontmatter
            head -20 "$f" | grep -q '^name:' || { echo "FAIL: $f missing name"; exit 1; }
            head -20 "$f" | grep -q '^description:' || { echo "FAIL: $f missing description"; exit 1; }

            # Description must be ≤ 60 words (token efficiency policy: 40, allow some slack)
            desc=$(awk '/^description:/,/^[a-z][a-z-]*:|^---/' "$f" | head -10 | tr '\n' ' ')
            words=$(echo "$desc" | wc -w)
            if [ "$words" -gt 70 ]; then
              echo "FAIL: $f description is $words words (max 70)"
              exit 1
            fi
          done
          echo "All SKILL.md files valid"

      - name: Shellcheck lib/*.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./lib
          severity: warning              # only fail on warning+; notes are advisory

      - name: Test lib/credentials.sh
        run: |
          export HOME=/tmp/ctt-test
          mkdir -p /tmp/ctt-test/.test/.git /tmp/ctt-test/.leak
          cat > /tmp/ctt-test/.test/credentials <<'EOF'
          [default]
          key = K_default
          token = T_default

          [work]
          key = K_work
          token = T_work
          EOF
          chmod 600 /tmp/ctt-test/.test/credentials

          source lib/credentials.sh

          # Test 1: default profile
          ctt_load_creds test
          test "$CTT_PROFILE" = "default" || { echo "FAIL test1: profile=$CTT_PROFILE"; exit 1; }
          test "$CTT_KEY" = "K_default" || { echo "FAIL test1: key=$CTT_KEY"; exit 1; }

          # Test 2: explicit profile arg
          ctt_load_creds test work
          test "$CTT_PROFILE" = "work" || { echo "FAIL test2: profile=$CTT_PROFILE"; exit 1; }
          test "$CTT_KEY" = "K_work" || { echo "FAIL test2: key=$CTT_KEY"; exit 1; }

          # Test 3: env var
          TEST_PROFILE=work ctt_load_creds test
          test "$CTT_PROFILE" = "work" || { echo "FAIL test3"; exit 1; }

          # Test 4: mask
          test "$(ctt_mask 'abcd1234efgh5678')" = "****5678" || { echo "FAIL test4"; exit 1; }

          # Test 5: nonexistent profile fails
          if ctt_load_creds test nonexistent 2>/dev/null; then
            echo "FAIL test5: should have failed"
            exit 1
          fi

          # Test 6: switching profiles must NOT leak fields from the previous
          # profile. Regression guard for the cross-profile contamination bug.
          cat > /tmp/ctt-test/.leak/credentials <<'EOF'
          [full]
          key = K_full
          default_team = ENG
          read_only = true

          [sparse]
          key = K_sparse
          EOF
          chmod 600 /tmp/ctt-test/.leak/credentials

          ctt_load_creds leak full
          test "$CTT_DEFAULT_TEAM" = "ENG" || { echo "FAIL test6 setup"; exit 1; }
          ctt_load_creds leak sparse
          test -z "${CTT_DEFAULT_TEAM:-}" || { echo "FAIL test6: default_team leaked: $CTT_DEFAULT_TEAM"; exit 1; }
          test -z "${CTT_READ_ONLY:-}" || { echo "FAIL test6: read_only leaked: $CTT_READ_ONLY"; exit 1; }
          test "$CTT_KEY" = "K_sparse" || { echo "FAIL test6: key wrong: $CTT_KEY"; exit 1; }

          # Test 7: control vars set by the user/CI survive a load
          export CTT_NONINTERACTIVE=1
          ctt_load_creds leak full
          test "$CTT_NONINTERACTIVE" = "1" || { echo "FAIL test7: CTT_NONINTERACTIVE was wiped"; exit 1; }

          # Test 8: a hostile environment must not be able to make a load unset the
          # CI safety gate (regression for the poisonable tracking-variable design)
          export CTT_NONINTERACTIVE=1
          export _CTT_LOADED_VARS=CTT_NONINTERACTIVE
          ctt_load_creds leak full
          test "$CTT_NONINTERACTIVE" = "1" || { echo "FAIL test8: env-poisoned load wiped CTT_NONINTERACTIVE"; exit 1; }
          unset _CTT_LOADED_VARS

          # Test 9: every truthy spelling of a gate flag normalises to "true"
          cat > /tmp/ctt-test/.leak/credentials <<'EOF'
          [a]
          key = k
          read_only = yes
          [b]
          key = k
          require_confirm = 1
          [c]
          key = k
          read_only = True
          [d]
          key = k
          read_only = no
          EOF
          ctt_load_creds leak a; test "$CTT_READ_ONLY" = "true"       || { echo "FAIL test9: yes"; exit 1; }
          ctt_load_creds leak b; test "$CTT_REQUIRE_CONFIRM" = "true" || { echo "FAIL test9: 1"; exit 1; }
          ctt_load_creds leak c; test "$CTT_READ_ONLY" = "true"       || { echo "FAIL test9: True"; exit 1; }
          ctt_load_creds leak d; test "$CTT_READ_ONLY" = "false"      || { echo "FAIL test9: no -> $CTT_READ_ONLY"; exit 1; }

          # Test 10: profile names that would inject an INI section or a regex are refused
          if ctt_save_profile leak "x]
          [default" "key=evil" 2>/dev/null; then echo "FAIL test10: section-injecting profile name accepted"; exit 1; fi
          if ctt_save_profile leak ok "key=a
          read_only=false" 2>/dev/null; then echo "FAIL test10: newline in value accepted"; exit 1; fi
          if ctt_load_creds leak '.*' 2>/dev/null; then echo "FAIL test10: regex profile name accepted by load"; exit 1; fi
          # (no pipeline here: the Actions shell runs with -o pipefail, and grep -c exits 1 on zero matches)
          if grep -q '^\[default\]' /tmp/ctt-test/.leak/credentials; then echo "FAIL test10: a [default] section was written"; exit 1; fi

          # Test 11: audit log cannot be given a forged second record.
          # Truncate first: ctt_audit_log appends, so without this the test only
          # passes on a pristine runner and fails on a second local run.
          mkdir -p /tmp/ctt-test/.claude-team-toolkit
          : > /tmp/ctt-test/.claude-team-toolkit/audit.log
          ctt_audit_log leak "created X in team $(printf 'ENG\n1970-01-01T00:00:00Z\tleak\tprod\tarchived Y')"
          test "$(wc -l < /tmp/ctt-test/.claude-team-toolkit/audit.log)" = "1" || { echo "FAIL test11: audit line forged"; exit 1; }

          # Test 12: an inline comment after a value is a comment, not part of the
          # value (every documented block writes "read_only = true   # ..."), while
          # a value that itself starts with '#' is a value (slack: #general), and a
          # value containing '=' survives the key/value split (base64)
          cat > /tmp/ctt-test/.leak/credentials <<'EOF'
          [c]
          key = k
          read_only = true            # documented style, must still gate
          require_confirm = true      ; ini-style comment too
          api_version = 5.1           # Server often needs 5.1
          default_channel = #general
          auth_header = Basic YWJjOmRlZg==
          noninteractive = 0
          EOF
          export CTT_NONINTERACTIVE=1
          ctt_load_creds leak c 2>/dev/null
          test "$CTT_READ_ONLY" = "true"                 || { echo "FAIL test12: read_only='$CTT_READ_ONLY'"; exit 1; }
          test "$CTT_REQUIRE_CONFIRM" = "true"           || { echo "FAIL test12: require_confirm='$CTT_REQUIRE_CONFIRM'"; exit 1; }
          test "$CTT_API_VERSION" = "5.1"                || { echo "FAIL test12: api_version='$CTT_API_VERSION'"; exit 1; }
          test "$CTT_DEFAULT_CHANNEL" = "#general"       || { echo "FAIL test12: default_channel='$CTT_DEFAULT_CHANNEL'"; exit 1; }
          test "$CTT_AUTH_HEADER" = "Basic YWJjOmRlZg==" || { echo "FAIL test12: auth_header='$CTT_AUTH_HEADER'"; exit 1; }
          test "$CTT_NONINTERACTIVE" = "1"               || { echo "FAIL test12: a credentials field overwrote CTT_NONINTERACTIVE"; exit 1; }

          # Test 13: an unrecognised gate value fails CLOSED, never open
          cat > /tmp/ctt-test/.leak/credentials <<'EOF'
          [u]
          key = k
          read_only = maybe
          EOF
          ctt_load_creds leak u 2>/dev/null
          test "$CTT_READ_ONLY" = "true" || { echo "FAIL test13: unrecognised read_only fell open: '$CTT_READ_ONLY'"; exit 1; }

          # Test 14: the documented short alias resolves, not just the derived
          # <SERVICE>_PROFILE name. PG_PROFILE is what the postgres skill and the
          # README tell users to put in a project .env; it was silently ignored,
          # so the load fell through to [default] -- the wrong database.
          mkdir -p /tmp/ctt-test/.postgres
          cat > /tmp/ctt-test/.postgres/credentials <<'EOF'
          [default]
          host = localhost
          [staging]
          host = stg.example.com
          EOF
          chmod 600 /tmp/ctt-test/.postgres/credentials
          PG_PROFILE=staging ctt_load_creds postgres
          test "$CTT_PROFILE" = "staging" || { echo "FAIL test14: PG_PROFILE ignored, got '$CTT_PROFILE'"; exit 1; }
          POSTGRES_PROFILE=staging ctt_load_creds postgres
          test "$CTT_PROFILE" = "staging" || { echo "FAIL test14: POSTGRES_PROFILE broke"; exit 1; }
          AZDO_PROFILE=staging ctt_load_creds postgres
          test "$CTT_PROFILE" = "default" || { echo "FAIL test14: another service's alias leaked in"; exit 1; }

          echo "lib/credentials.sh: 14/14 tests pass"

  no-credential-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no real credential patterns
        run: |
          # Look for real-looking AWS/GH/Heroku/Slack patterns. Placeholders
          # use 'x' repeated; real tokens don't.
          set +e
          found=0
          for pat in \
            'AKIA[A-HJ-NP-Z0-9]{16}' \
            'ghp_[A-Za-z0-9]{36}' \
            'gho_[A-Za-z0-9]{36}' \
            'HRKU-[a-f0-9]{32,}' \
            'xoxb-[0-9]{11,13}-[0-9]{11,13}-[A-Za-z0-9]{24}' \
            'sntrys_[A-Za-z0-9_]{60,}' \
            'lin_api_[A-Za-z0-9]{40,}' \
            'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{80,}'; do
            matches=$(grep -rEn "$pat" --include='*.md' --include='*.json' --include='*.sh' --include='*.yml' --include='*.example' . 2>/dev/null | grep -v 'xxx' | grep -v 'X{')
            if [ -n "$matches" ]; then
              echo "POTENTIAL LEAK matching $pat:"
              echo "$matches"
              found=1
            fi
          done
          [ "$found" -eq 0 ] && echo "No real credentials detected"
          exit $found

      - name: Placeholders must not be shaped like real keys
        run: |
          # The scan above excludes lines containing 'xxx', so an xxx-filled
          # placeholder that still MATCHES a vendor's token pattern slips past
          # it -- and GitHub push protection then rejects the push. That
          # happened with lin_api_ + 40 x's: 'x' is in Linear's key charset,
          # so the placeholder was a valid-shaped Linear key. Break
          # placeholders with a character outside the charset instead,
          # e.g. lin_api_YOUR-KEY-HERE.
          set +e
          found=0
          for spec in \
            'lin_api_[A-Za-z0-9]{40,}:Linear API key' \
            'ATTA[A-Za-z0-9]{60,}:Trello token'; do
            pat="${spec%%:*}"; name="${spec#*:}"
            hits=$(grep -rEn "$pat" --include='*.md' --include='*.json' --include='*.sh' \
                     --include='*.yml' --include='*.example' . 2>/dev/null)
            if [ -n "$hits" ]; then
              echo "FAIL: text shaped like a $name (real or placeholder):"
              echo "$hits"
              echo "  If it is a placeholder, break the charset: lin_api_YOUR-KEY-HERE"
              found=1
            fi
          done
          [ "$found" -eq 0 ] && echo "No key-shaped placeholders"
          exit $found

      - name: Verify .gitignore blocks key/cert/cred patterns
        run: |
          for f in test.key test.pem test.p12 id_rsa firebase-adminsdk-foo.json gcp-key.json .kube/config secrets.yml .env credentials.json random.token; do
            if ! git check-ignore "$f" >/dev/null 2>&1; then
              echo "FAIL: $f not blocked by .gitignore"
              exit 1
            fi
          done
          echo "All credential file patterns properly blocked"
